[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "docstacks"
version = "0.1.0.dev0"
description = "Deploy and manage versioned Sphinx/static-HTML documentation sites"
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "Eric Larson", email = "larson.eric.d@gmail.com" }]
keywords = ["documentation", "sphinx", "versioning", "github-pages"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Documentation :: Sphinx",
  "Topic :: Software Development :: Build Tools",
]
dependencies = []

[project.scripts]
docstacks = "docstacks.cli:main"

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.hatch.build.targets.wheel]
packages = ["src/docstacks"]

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W", "C4", "SIM"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
