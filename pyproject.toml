[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[dependency-groups]
dev = ["pytest", "pytest-cov", "ruff", "ty"]

[project]
authors = [{email = "larson.eric.d@gmail.com", name = "Eric Larson"}]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Documentation :: Sphinx",
  "Topic :: Software Development :: Build Tools",
]
dependencies = []
description = "Deploy and manage versioned Sphinx/static-HTML documentation sites"
keywords = ["documentation", "github-pages", "sphinx", "versioning"]
license = "BSD-3-Clause"
license-files = ["LICENSE"]
name = "docstacks"
readme = "README.md"
requires-python = ">=3.10"
version = "0.1.0.dev0"

[project.scripts]
docstacks = "docstacks.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/docstacks"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["B", "C4", "E", "F", "I", "SIM", "UP", "W"]

[tool.tomlsort]
all = true
ignore_case = true
spaces_before_inline_comment = 2
trailing_comma_inline_array = true

[tool.ty.environment]
python-version = "3.10"  # minimum supported, keep in sync with requires-python

[tool.ty.src]
include = ["src", "tests"]
